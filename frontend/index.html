<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Acadêmico DS II</title>

    <link rel="stylesheet" href="./css/estilo.css">
    
    <script src="./js/model/aluno-model.js" defer>
    </script>
    <script src="./js/view/aluno-view.js" defer>
    </script>
    <script src="./js/controller/aluno-controller.js" defer>
    </script>


</head>

<body>


    <header class="cabecalho">

        <div class="container">
            <center>
                <h1>Sistema Acadêmico DS II</h1>
            </center>
            <center>
                <p>Versão 0.2 - cadastro de alunos com DOM e eventos</p>
            </center>
        </div>

    </header>

    <main class="container">

        <section class="cartao">

            <h2>Cadastro de aluno</h2>
            <p>Preencha os campos abaixo para cadastrar um aluno.</p>

            <!--
            Formulário para receber os dados
            -->

            <form id="form-aluno" novalidate>

                <!--
                Agrupando os campos para o CSS organizá-los
                -->

                <div class="grade-formulario">

                     <!--
                    campo para RA
                    -->
                    <div class="campo">

                     <!--
                    O atributo "for" vai apontar com foco para a caixa digitável
                    -->

                        <label for="ra">RA</label>
                        <!--
                        campo para o RA.
                        id: view utiliza para localizar elemento
                        name: identifica o campo no formulário
                        placeholder: apresentar um exemplo
                        required: informa o campo obrigatório semanticamente 
                        -->
                        <input 
                        type="text" 
                        id="ra" 
                        name="ra" 
                        placeholder="Exemplo: 20265032..."
                        required
                        >

                    </div>

                    <!--
                        Campo para o nome
                        -->
                    <div class="campo">
                        <label for="nome">Nome</label>

                        <input 
                        type="text" 
                        id="nome" 
                        name="nome" 
                        placeholder="Nome completo" 
                        required
                        >
                    </div>

                    <!--
                        Campo para o e-mail
                        -->

                    <div class="campo">
                        <label for="email">E-mail</label>

                        <!--
                        type = "email" informa que o campo representar um endereço de e-mail.
                        como o formulário posso novalidade a validação continua com a Model
                         -->

                        <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="aluno@email.com" 
                        required
                        >
                    </div>

                    <!--
                    campo para o curso
                    -->

                    <div class="campo">
                        <label for="curso">Curso</label>

                        <input 
                        type="text" 
                        id="curso" 
                        name="curso" 
                        placeholder="Exemplo: DSM"
                        required
                        >

                    </div>

                    <!--
                    campo para a turma
                    -->

                    <div class="campo">
                        <label for="turma">Turma</label>

                        <input 
                        type="text" 
                        id="turma" 
                        name="turma"
                        placeholder="Exemplo: 2 DSM" 
                        required
                        >
                    </div>
                </div>

                <!--
                    Botão para o envio do formulário
            
                    type= "submit" faz o envio para o form
                    A view observará o evento no addEventListener().
                    -->

                <button type="submit">
                    Cadastrar aluno
                </button>
            </form>


            <!--
            Área destinada a mensagem do sistema
            ex:
            -aluno cadastrado com sucesso!
            -Já existe um aluno com o mesmo RA

            role = "status": identifica a areia como mensagem de estado.
            aria-live="polite": permite que leitores de tela anunciem
            mudanças sem interromper imediatamento o usuário
            -->

            <div 
            id="mensagem" 
            class="mensagem" 
            role="status" 
            aria-live="polite">
            </div>
        </section>


        <!--
        Segundo cartão da interface.
        Apresentará alunos cadastrados
        -->

        <section class="cartao">

            <!--
           Agrupa o titulo e o contador de alunos
            -->
            <div class="titulo-secao">

                <h2>Alunos cadastrados</h2>

                <!--
                A view se encarrega de atualiza
                ex:
                total: 0
                total: 1
                total: 2
                ...
                -->
                <p id="total-alunos">
                    total: 0
                </p>
            </div>

            <!--
            Container que permite rolagem horizontal.
            evita que ultapase tela menores
            -->

            <div class="tabela-responsiva">

                    <!--
                    Tabela responsável pela apresentação 
                    dos alunos cadastrados
                    -->

                <table>

                    <!--
                    tread contém o cabeçalho da tabela
                    -->

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>RA</th>
                            <th>Nome</th>
                            <th>E-mail</th>
                            <th>Curso</th>
                            <th>Turma</th>
                            <th>Situação</th>
                        </tr>
                    </thead>

                    <!--
                    tbody receberá as linhas dos alunos,
                    começa vazio para o view criar dinamicamente
                    -->
                    <tbody id="corpo-tabela-alunos">
                    </tbody>
                </table>
            </div>
        </section>
        

        <!--
        Terceiro cartão da interface.
        seção que representará JSON dos alunos
        -->

        <section class="cartao">

            <h2>Representação em JSON</h2>

            <p>A lista abaixo é atualizada após cada cadastro.</p>

            <!--
            A tag pre preserva:
            -espaços,
            - identação,
            - quebra de linha.

            conteudo inicial é um array vazio : 
            []
            -->

            <pre id="saida-json">[]</pre>
        </section>
    </main>
</body>

</html>
